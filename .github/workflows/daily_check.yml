name: eCourts Daily Case Check

on:
  # ── Scheduled: every day at 10:00 AM IST = 04:30 UTC ─────────────────────
  schedule:
    - cron: "30 4 * * *"

  # ── Manual trigger from GitHub Actions UI ─────────────────────────────────
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check cases but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_email:
        description: "Skip email notification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_telegram:
        description: "Skip Telegram notification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2-hour hard cap for the whole job

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. System deps (Tesseract) ───────────────────────────────────────────
      # Install before Playwright so apt state is clean.
      # libasound2t64 is the Ubuntu 24.04 name (libasound2 was renamed).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr libasound2t64

      # ── 4. Python dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Playwright + Chromium ─────────────────────────────────────────────
      # playwright>=1.45 knows about Ubuntu 24.04 package renames.
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 6. Run the checker ───────────────────────────────────────────────────
      # Cases and status are read/written to MongoDB Atlas (shared with the bot).
      - name: Run case checker
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}"       = "true" ]; then FLAGS="$FLAGS --dry-run";  fi
          if [ "${{ github.event.inputs.skip_email }}"    = "true" ]; then FLAGS="$FLAGS --no-email"; fi
          if [ "${{ github.event.inputs.skip_telegram }}" = "true" ]; then FLAGS="$FLAGS --no-tg";    fi
          python run_checker.py $FLAGS
